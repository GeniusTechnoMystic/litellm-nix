# This pyproject.toml has been converted from Poetry's [tool.poetry]
# specification to the PEP 621 format.  It captures the same metadata,
# dependencies and optional dependency groups (extras) defined in the
# upstream project while using the standard `[project]` table.

[project]
# Basic project metadata
name = "litellm"
version = "1.82.6"
description = "Library to easily interface with LLM API providers"
authors = [{name = "BerriAI"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14,!=3.9.7"

# Dependency declarations. Optional features are defined below under
# `[project.optional-dependencies]`.
dependencies = [
    "aiohttp>=3.13.3",              # for network calls
    "anyio>=4.8.0",                 # openai + http req.
    "click>=8.1.7",                 # for proxy cli
    "fastuuid>=0.13.5",             # for uuid4
    "httpx>=0.28.1",
    "importlib-metadata>=6.8.0",    # for random utils
    "jinja2>=3.1.6,<4.0",           # for prompt templates
    "jsonschema>=4.23.0,<5.0.0",    # validating json schema - aligned with openapi-core + mcp
    "openai>=2.24.0",               # openai req.
    "pydantic>=2.11.0,<3.0.0",      # proxy + openai req. + mcp
    "python-dotenv>=1.0.1",         # for env
    "tiktoken>=0.8.0",              # for calculating usage
    "tokenizers>=0.20.2",           # for calculating usage
]

[project.urls]
homepage = "https://litellm.ai"
repository = "https://github.com/BerriAI/litellm"
documentation = "https://docs.litellm.ai"

[project.optional-dependencies]

security = [
    "detect-secrets>=1.5.0",         # Enterprise - secret detection / masking in LLM requests
    "PyJWT[crypto]>=2.12.0,<3.0.0; python_version >= '3.9'",
    "sentry_sdk>=2.21.0",            # for sentry error handling
]

runtime = [
    "apscheduler>=3.10.4,<4.0.0",   # background scheduling
    "async_generator>=1.10.0",      # for async ollama calls    
    "backoff>=2.2.1",               # retry logic
    "cryptography>=46.0.5",         # encryption primitives, GHSA-r6ph-v2qm-q3c2
    "filelock>=3.20.1",             # file locking, CVE-2025-68146    
    "orjson>=3.11.7,<4.0.0",        # fast /embedding responses
    "pynacl>=1.6.2,<2.0.0",         # for encrypting keys
    "tenacity>=8.5.0",              # for retrying requests, when litellm.num_retries set
    "tornado>=6.5.3",               # async networking utilities, CVE-2025-67725, CVE-2025-67726, CVE-2025-67724
    "tzdata>=2025.1",               # IANA time zone database
    "urllib3>=2.6.0",               # HTTP client, CVE-2025-66471, CVE-2025-66418, CVE-2026-21441    
]

server = [
    "litellm[runtime]",
    "fastapi-sso>=0.19.0,<1.0.0",   # admin UI, SSO
    "fastapi>=0.120.1",             # server dep
    "gunicorn>=23.0.0,<24.0.0",     # server dep
    "h11>=0.16.0",                  # CVE-2025-43859, GHSA-vqfr-h8mv-ghfj — HTTP request smuggling
    "python-multipart>=0.0.20",     # admin UI
    "pyyaml>=6.0.2,<7.0.0",         # server dep
    "rich>=13.7.1,<14.0.0",         # for litellm proxy cli
    "starlette>=0.49.1",            # starlette fastapi dep
    "uvicorn>=0.32.1,<1.0.0",       # server dep
    "uvloop>=0.21.0; sys_platform != 'win32'", # uvicorn dep, gives us much better performance under load
    "websockets>=15.0.1,<16.0.0",   # for realtime API    
]

mcp = [
    "mcp>=1.25.0,<2.0.0; python_version >= '3.10'", # Model Context Protocol services
]

storage = [
    "diskcache>=5.6.1,<6.0.0",
    "litellm-proxy-extras>=0.4.60,<0.5.0",  # for proxy extras - e.g. prisma migrations
    "nodejs-wheel-binaries>=24.13.1",       # required by prisma for migrations, prevents runtime download (updated from nodejs-bin for security fixes)
    "prisma>=0.11.0,<0.12.0",               # for db
    "redis>=5.2.1",                         # redis caching
    "redisvl>=0.4.1,<0.5.0; python_version >= '3.9' and python_version < '3.14'", ## redis semantic caching
    "rq",                                   # Redis-backed job queue
]

observability = [
    "ddtrace>=2.19.0",          # for advanced DD tracing / profiling
    "langfuse>=2.59.7,<3.0",    # for langfuse self-hosted logging    
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "prometheus-client>=0.20.0",# for /metrics endpoint on proxy
    "pyroscope-io>=0.8,<1.0.0; sys_platform != 'win32'",
]

aws = [
    "aioboto3>=15.5.0",         # for async sagemaker calls (updated to match boto3 1.40.73)
    "boto3>=1.40.46",           # aws bedrock/sagemaker calls (has bedrock-agentcore-control, compatible with aioboto3)
    "mangum>=0.17.0",           # for aws lambda functions
]

azure = [
    "a2a-sdk>=0.3.22,<0.4.0; python_version >= '3.10'",    
    "azure-ai-contentsafety>=1.0.0",        # for azure content safety
    "azure-identity>=1.16.1,<2.0.0; python_version >= '3.9'", # for azure content safety
    "azure-keyvault-secrets>=4.8.0,<5.0.0",
    "azure-keyvault>=4.2.0",                # for azure KMS integration
    "azure-storage-blob>=12.25.1,<13.0.0",
    "azure-storage-file-datalake>=12.20.0", # for azure buck storage logging
]

gcp = [
    "anthropic[vertex]>=0.54.0",    
    "google-cloud-aiplatform>=1.133.0", # for vertex ai calls
    "google-cloud-iam>=2.19.1,<3.0.0",  # for GCP IAM Redis authentication
    "google-cloud-kms>=2.21.3,<3.0.0",
    "google-genai>=1.37.0",
]

cloud = [
  "litellm[aws]",
  "litellm[azure]",
  "litellm[gcp]"
]

providers = [
    "anthropic>=0.54.0",   
    "cohere>=5",
    "llm-sandbox>=0.3.31",              # for skill execution in sandbox    
]

routing = [
    "semantic-router>=0.1.12; python_version >= '3.9' and python_version < '3.14'",
    "aurelio-sdk>=0.0.19",
]

analytics = [
    "litellm[observability]",
    "mlflow>=3.1.5; python_version >= '3.10'",    
    "polars>=1.31.0,<2.0.0; python_version >= '3.10'", # for data processing
    "pypdf>=6.7.3",                 # for PDF text extraction in RAG ingestion (CVE-2026-27888)
]

media = [
    "Pillow>=12.1.1",           # GHSA-cfh3-3jmp-rvhc    
    "soundfile>=0.12.1,<1.0.0", # for audio file processing
]

communication = [
    "resend>=0.8.0",        # email delivery service
]

grpc = [
    "grpcio>=1.62.3,!=1.68.*,!=1.69.*,!=1.70.*,!=1.71.0,!=1.71.1,!=1.72.0,!=1.72.1,!=1.73.0; python_version < '3.14'",
    "grpcio>=1.75.0; python_version >= '3.14'",
]

enterprise = [
    "litellm[analytics]",
    "litellm[cloud]",
    "litellm[communication]",
    "litellm-enterprise>=0.1.35,<0.2.0",    
    "litellm[providers]", 
    "litellm[media]",
    "litellm[mcp]",
    "litellm[observability]",
    "litellm[routing]",
    "litellm[security]",
    "litellm[server]",    
    "litellm[storage]"
]

all = [
    "litellm[enterprise]",
    "litellm[grpc]",
]

[dependency-groups]
prod = [
    "litellm[enterprise]",
    "litellm[grpc]",
    #"hatchling", # Forces uv2nix to successfully map this group
]
dev = [ 
    "litellm[enterprise]",
    "litellm[grpc]", 
    "black>=23.12.0",
    "diff-cover>=9.0",
    "fakeredis>=2.27.1",
    "fastapi-offline>=1.7.3",
    "flake8>=6.1.0",
    "hypercorn>=0.15.0,<0.16.0",
    "jaraco.context>=6.1.0",
    "mypy>=1.0",
    "pygitguardian",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "pytest-postgresql>=6.0.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.5.0",
    "pytest>=7.4.3",
    "requests-mock>=1.12.1",
    "responses>=0.25.7",
    "respx>=0.22.0",
    "ruff>=0.2.1",
    "types-PyYAML",
    "types-redis",
    "types-requests",
    "types-setuptools",
    "wheel>=0.46.2",        # CVE-2026-24049 — path traversal
    "numpydoc",    
    "openapi-core>=0.21.0", # for OpenAPI compliance tests
    "parameterized>=0.9.0"
]

docs = [
    "numpydoc",
]

analysis = [
    "openapi-core>=0.21.0", # for OpenAPI compliance tests
]

[tool.isort]
profile = "black"

[project.scripts]
litellm = "litellm:run_server"
litellm-proxy = "litellm.proxy.client.cli:cli"

# Retain commitizen and other tool configurations under their respective
# namespaces.  These sections are not part of the PEP 621
# `[project]` table but are preserved here for tooling integration.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    # Nix & Local Build Artifacts
    ".direnv",
    "nix/result",
    "result",
    "result-*",
    "dist/",
    
    # Monorepo Sub-packages (Keeps root sdist lean)
    "enterprise",
    "litellm-js",
    "litellm-proxy-extras",
    "ui",    

    # CI/CD & Repository Metadata (Tracked by Git, but irrelevant to package consumers)
    ".circleci",
    ".claude",
    ".devcontainer",
    ".dockerignore",
    ".env.example",
    ".envrc",
    ".flake8",
    ".git-blame-ignore-revs",
    ".gitattributes",
    ".gitguardian.yaml",
    ".github",
    ".mise.toml",
    ".pre-commit-config.yaml",
    ".semgrep",
    ".trivyignore",
    ".venv",

    # Deployment & Infrastructure
    "docker/",
    "Dockerfile",
    "docker-compose*.yml",
    "deploy/",
    "render.yaml",
    "prometheus.yml",

    # Developer Guides & Docs (Keep README.md)
    "docs/",
    "cookbook/",
    "AGENTS.md",
    "ARCHITECTURE.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "GEMINI.md",
    "security.md",

    # Scripts & CI Tooling
    "ci_cd/",
    "scripts/",
    "db_scripts/",
    "Makefile",

    # Linter & Tool configs
    "ruff.toml",
    "taplo.toml",
    "pyrightconfig.json",
    "codecov.yaml",

    # Legacy/Alternative Package manager files
    "package.json",
    "package-lock.json",
    "poetry.lock",
    "requirements.txt",
    "flake.lock",
    "flake.nix",

    # Tests
    "tests/"    
]

[tool.hatch.build.targets.wheel]
packages = ["litellm"]

[tool.commitizen]
version = "1.82.6"
version_files = [
    "pyproject.toml:^version",
]

[tool.mypy]
plugins = "pydantic.mypy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "asyncio: mark test as an asyncio test",
    "limit_leaks: mark test with memory limit for leak detection (e.g., '40 MB')",
    "no_parallel: mark test to run sequentially (not in parallel) - typically for memory measurement tests",
]
filterwarnings = [
    # Suppress Pydantic serializer warnings from mock server responses (non-critical for memory tests)
    # These occur because the mock server returns a simplified response format
    "ignore:Pydantic serializer warnings:UserWarning",
    "ignore::UserWarning:pydantic.main",
    # Suppress pytest-asyncio event loop deprecation warning (handled automatically by pytest-asyncio)
    "ignore::DeprecationWarning:pytest_asyncio.plugin",
]

[tool.uv.workspace]
members = [
    "enterprise",
    "litellm-proxy-extras"
]

[tool.uv.sources]
litellm-enterprise = { workspace = true }
litellm-proxy-extras = { workspace = true }

[tool.uv.extra-build-dependencies]
ml-dtypes = [ "setuptools", "numpy" ]

