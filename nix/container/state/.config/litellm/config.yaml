router_settings:
  allowed_fails: 3
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 3
    BadRequestErrorAllowedFails: 3
    ContentPolicyViolationErrorAllowedFails: 3
    InternalServerErrorAllowedFails: 3
    RateLimitErrorAllowedFails: 3
    TimeoutErrorAllowedFails: 3
  content_policy_fallbacks:
  - large-2M:
    - obedient-large
  - agent:
    - obedient
  cooldown_time: 25
  disable_cooldowns: false
  enable_pre_call_checks: true
  enable_tag_filtering: true
  num_retries: 3
  retry_policy:
    AuthenticationErrorRetries: 3
    ContentPolicyViolationErrorRetries: 3
    InternalServerErrorRetries: 3
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 3
  routing_strategy: usage-based-routing-v2
  tag_filtering_match_any: true
  timeout: 35
