version: '3.9'
services:
  litellm:
    image: localhost/litellm:latest
    container_name: litellm
    working_dir: /workspace
    ports:
      - "4000:4000"

    # --- Execution ---
    # Pass the config explicitly to ensure LiteLLM finds it
    # We rely entirely on the Nix-embedded 'start-litellm' wrapper.
    # Since 'command' overrides the image's default Cmd, we must invoke the wrapper explicitly.
    command: ["start-litellm", "--config", "/state/.config/litellm/config.yaml"]

    secrets:
      - env_secrets
      - gcp_service_account

    # --- Environment passthrough ---
    environment:
      LITELLM_HOSTNAME: "0.0.0.0"
      HOME: /state
      CONFIG_FILE_PATH: /state/.config/litellm/config.yaml 
      ENV_VAR_FILE: /run/secrets/env_secrets
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_service_account

      # --- Mutability / State Redirection ---
      # Force standard Linux cache/data directories into the persistent state volume
      XDG_CACHE_HOME: /state/.cache
      XDG_DATA_HOME: /state/.local/share
      XDG_CONFIG_HOME: /state/.config
      
      # Route ephemeral tokenizers and model downloads into the fast tmpfs
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
      HF_HOME: /tmp/huggingface

      # We move the migration working dir to /tmp (tmpfs) to avoid host permission issues.
      # LiteLLM always attempts to copy migrations here at startup.
      LITELLM_MIGRATION_DIR: /tmp/litellm/migrations
      LITELLM_SKIP_DB_SETUP: "True"
      LITELLM_MIGRATE: "False"
      UI_DB_PRIMARY: "True" # Forces the UI to assume the DB is managed externally
      
      APSCHEDULER_COALESCE: "true"
      APSCHEDULER_MAX_INSTANCES: "5"
      ANONYMIZED_TELEMETRY: "true"
      #QDRANT_API_KEY = "16rJUMBRx*************"
      #QDRANT_API_BASE: grpc://host.docker.internal:6334
      #QDRANT_API_BASE: http://host.docker.internal:6333
      QDRANT_API_BASE: http://host.containers.internal:6333
      
      LITELLM_HEALTH_CHECK_MAX_TOKENS: 16
      DEFAULT_HEALTH_CHECK_PROMPT: "Respond with exactly 'Online'"

      DATABASE_HOST: host.containers.internal
      DATABASE_NAME: litellm
      DATABASE_PORT: 5432
      DATABASE_URL:  postgresql://litellm@host.containers.internal:5432/litellm
      DATABASE_USER: litellm
      
    extra_hosts:
      - "host.containers.internal:host-gateway"

    # --- Volumes ---
    volumes:
      - ./workspace:/workspace
      - ./state:/state

    # --- Security & User Namespace ---
    #userns_mode: keep-id
    #user: "${UID}:${GID}"
    #user: litellm:litellm

    security_opt:
      - no-new-privileges:true
      - label=disable

    cap_drop:
      - ALL

    # --- Read-only root filesystem (optional but recommended) ---
    # read_only: true

    tmpfs:
      - /tmp:rw,size=128M
      - /run:rw,size=64M

    # --- Resource Limits ---
    cpus: 2
    mem_limit: 4g
    pids_limit: 256

    # --- Restart Policy ---
    restart: "no"

    # --- Network Mode ---
    network_mode: bridge

    #tty: true

    dns:
      - 1.1.1.1
      - 8.8.8.8

#volumes:
#    workspace-data:

# --- Top Level Secrets Definition ---
# Instructs Compose to pull from the native Podman secrets engine
secrets:
  env_secrets:
    #external: true
    file: ./secrets/env_secrets.txt
  gcp_service_account:
    #external: true
    file: ./secrets/gcp_service_account.json

